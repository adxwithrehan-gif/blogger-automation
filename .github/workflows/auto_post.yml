name: Auto Blogger CI

on:
  schedule:
    # Har 6 ghante baad chalne ka schedule (Rat 1:00, Subah 7:00, Dopahar 1:00, Sham 7:00)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Run Auto Blogger Script
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python auto_blogger.py
