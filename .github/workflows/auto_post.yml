name: Daily Trending News Auto Blogger

on:
  schedule:
    # Roz subah 7:00 AM UTC par chalne ke liye
    - cron: '0 7 * * *'
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  run-blogger-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth-oauthlib google-auth google-api-python-client google-generativeai

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
        run: |
          python auto_blogger.py
