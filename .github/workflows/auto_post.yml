name: Auto Blogger CI

on:
  schedule:
    # Yeh har 6 ghante baad khud ba khud chalegi (aap time apne mutabiq badal sakte hain)
    - cron: '0 */6 * * *'
  workflow_dispatch:gh

jobs:
  run-blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client google-genai

      - name: Run Auto Blogger Script
        run: python auto_blogger.py
